packages:
  - apps/*
  - packages/*

# Every example takes its versions from this catalog (`"catalog:"`) so the
# generated code across apps is produced by the same hono-takibi / hono / zod.
catalogMode: strict
catalog:
  '@hono/zod-openapi': ^1.6.3
  '@types/node': ^26.6.5
  hono: ^4.13.13
  hono-takibi: ^0.28.0
  typescript: ^7.0.2
  zod: ^4.6.7
allowBuilds:
  esbuild: set this to true or false
minimumReleaseAgeExclude:
  - hono-takibi@0.25.0
  - hono-takibi@0.26.0
  - hono-takibi@0.27.0
  - hono-takibi@0.28.0
