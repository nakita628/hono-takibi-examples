name: typecheck

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

env:
  # 最大シャード数。チェック対象の app がこれより少なければ app 数に合わせて減らす。
  MAX_SHARDS: 8
  # app 1 つあたりの typecheck の制限時間。超えたらスキップする。
  APP_TIMEOUT: 10m

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR では変更のあった app だけをチェックする。
      # ルートの package.json / bun.lock / packages/ / この workflow が変わった場合や main への push では全 app をチェックする。
      # 各 app の src のサイズを重みにして、合計が均等になるようにシャードへ振り分ける（大きい順に一番軽いシャードへ入れる）。
      - name: Plan shards
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            if echo "$changed" | grep -qE '^(package\.json|bun\.lock|packages/|\.github/workflows/typecheck\.yml)'; then
              apps=$(ls -d apps/*/)
            else
              apps=$(echo "$changed" | grep -oE '^apps/[^/]+/' | sort -u || true)
            fi
          else
            apps=$(ls -d apps/*/)
          fi

          weighted=""
          for dir in $apps; do
            [ -f "$dir/package.json" ] || continue
            size=$(du -sb "$dir/src" 2>/dev/null | cut -f1)
            weighted+="${size:-0} $dir"$'\n'
          done

          count=$(printf '%s' "$weighted" | grep -c . || true)
          n=$(( count < MAX_SHARDS ? count : MAX_SHARDS ))
          if [ "$n" -eq 0 ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            matrix=$(printf '%s' "$weighted" | jq -Rnc --argjson n "$n" '
              [inputs | select(length > 0) | split(" ") | {size: (.[0] | tonumber), dir: .[1]}]
              | sort_by(-.size)
              | reduce .[] as $a ([range($n)] | map({apps: [], size: 0});
                  (to_entries | min_by(.value.size) | .key) as $i
                  | .[$i].apps += [$a.dir] | .[$i].size += $a.size)
              | to_entries | map({shard: (.key + 1), apps: (.value.apps | join(" "))})
              | {include: .}')
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count apps -> $n shards"

  shard:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    name: shard ${{ matrix.shard }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # app ごとに APP_TIMEOUT の制限時間を付ける。
      # 時間切れ（exit 124）や強制終了（exit 137、メモリ不足など）になった app は失敗にせず、スキップとして警告を出す。
      - name: Typecheck
        env:
          APPS: ${{ matrix.apps }}
        run: |
          failed=()
          skipped=()
          for dir in $APPS; do
            echo "::group::$dir"
            set +e
            # bun run 経由だと時間切れで止めても子の tsc が残るので、tsc を直接呼ぶ（各 app の typecheck スクリプトと同じコマンド）。
            (cd "$dir" && timeout -k 30s "$APP_TIMEOUT" node_modules/.bin/tsc --noEmit)
            code=$?
            set -e
            echo "::endgroup::"
            case "$code" in
              0) ;;
              124) skipped+=("$dir (timeout $APP_TIMEOUT)") ;;
              137) skipped+=("$dir (killed)") ;;
              *) failed+=("$dir") ;;
            esac
          done
          {
            echo "### shard ${{ matrix.shard }}"
            for s in "${skipped[@]}"; do echo "- ⏭️ skipped: $s"; done
            for f in "${failed[@]}"; do echo "- ❌ failed: $f"; done
          } >> "$GITHUB_STEP_SUMMARY"
          for s in "${skipped[@]}"; do echo "::warning::typecheck skipped: $s"; done
          if [ ${#failed[@]} -gt 0 ]; then
            for f in "${failed[@]}"; do echo "::error::typecheck failed: $f"; done
            exit 1
          fi

  # ブランチ保護の必須チェックにはこのジョブ（typecheck）を指定する。
  # シャード数が変わってもジョブ名が変わらないようにするため。
  typecheck:
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.plan.result }}" != "success" ]; then exit 1; fi
          case "${{ needs.shard.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
